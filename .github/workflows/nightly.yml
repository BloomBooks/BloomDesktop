# Nightly build + full test run of everything on master.
#
# This is a health check, not a release: it builds the front-end and the C# solution and
# runs all five test suites — front-end vitest, C# NUnit, the BloomE2E suite, the visual
# regression suite, and the component-tester Playwright suite — but produces no installer, does
# no signing, and publishes nothing. It exists to catch breakage that the PR checks miss — e.g.
# tests excluded from PR runs, or rot from dependency/runner drift — on a predictable cadence.
#
# Each suite publishes its own check run / job-summary section, so the commit shows five
# independent results rather than one merged total. See the "Test reports" steps at the end.
#
# Schedule: 04:00 UTC daily. GitHub cron is always UTC (== GMT, no DST), so this is a
# literal 4am GMT. Note GitHub may delay scheduled runs during peak load; exact timing is
# best-effort. Can also be run on demand via the Actions "Run workflow" button.
#
# A manual run can pick which of the five suites to run; all five are ticked by default, so the
# default manual run matches the scheduled one. Unticking the ones you don't need is how to iterate
# quickly when chasing a failure in a single suite: the C# suite alone is ~9 minutes of a ~22-minute
# run, so dropping it takes an attempt to ~12. That was added while hunting the intermittent
# visual-regression hang in BL-16612.
#
# The two BUILDS always run and are not selectable, because they are prerequisites rather than
# suites: the C# build needs the front-end build's output, and the two suites that drive a real
# Bloom.exe (BloomE2E and visual regression) need both. Unticking every suite is therefore a valid
# "does it still build" check.
#
# Note this is a selection, not a reordering. Reordering the steps so a chosen suite runs earlier
# would be safe on paper -- nothing gates on either test suite except its own publish step -- but the
# scheduled run is where our record of how often something fails comes from, and a suite that runs on
# a machine which has NOT just spent nine minutes being hammered by the C# tests is being sampled
# under different conditions. For an intermittent, possibly load-sensitive failure that matters, so
# the scheduled run keeps its shape and manual runs vary only in what they skip.

name: Nightly Build and Test

on:
    schedule:
        - cron: "0 4 * * *"
    workflow_dispatch:
        inputs:
            run_frontend_tests:
                description: "Front-end suite (vitest)"
                type: boolean
                default: true
            run_csharp_tests:
                description: "C# suite (NUnit) - the slowest, ~9 min"
                type: boolean
                default: true
            run_e2e_tests:
                description: "BloomE2E suite (clicks through a real Bloom)"
                type: boolean
                default: true
            run_visual_regression:
                description: "Visual-regression suite (drives a real Bloom)"
                type: boolean
                default: true
            run_component_tests:
                description: "Component-tester suite (Playwright against the Vite harness)"
                type: boolean
                default: true

# Don't stack nightlies: if a manual run overlaps the scheduled one, let the first finish.
concurrency:
    group: nightly
    cancel-in-progress: false

jobs:
    build-and-test:
        runs-on: windows-latest
        timeout-minutes: 120

        # checks: write lets the test-report step create its check run.
        permissions:
            contents: read
            checks: write

        env:
            # VersionNumbers requires a 4-part BUILD_NUMBER; nightlies never publish, so a
            # throwaway value that just identifies the run is fine.
            BUILD_NUMBER: 0.0.${{ github.run_number }}.0
            # Which suites this run should do. A scheduled run always does all of them; a manual run does
            # whichever boxes were ticked. Resolved once here so the step conditions stay readable, and
            # compared as strings at the point of use because env values are always strings.
            RUN_FRONTEND_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_frontend_tests }}
            RUN_CSHARP_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_csharp_tests }}
            RUN_E2E_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e_tests }}
            RUN_VISUAL_REGRESSION: ${{ github.event_name != 'workflow_dispatch' || inputs.run_visual_regression }}
            RUN_COMPONENT_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_component_tests }}

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # ----- Toolchains -----

            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
              with:
                  dotnet-version: 8.0.x

            - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: src/BloomBrowserUI/package.json

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  # Track the repo's canonical Node version (.node-version, currently
                  # 24.13.0 — also what package.json devEngines pins) rather than a
                  # hardcoded major, so the nightly always tests the version developers
                  # actually use and never drifts from it.
                  node-version-file: .node-version
                  cache: pnpm
                  cache-dependency-path: |
                      src/BloomBrowserUI/pnpm-lock.yaml
                      src/content/pnpm-lock.yaml
                      src/BloomE2E/pnpm-lock.yaml
                      src/BloomVisualRegressionTests/pnpm-lock.yaml
                      src/BloomBrowserUI/react_components/component-tester/pnpm-lock.yaml

            # ----- Dependencies (mirrors init.sh) -----

            - name: Get binary dependencies (TeamCity artifacts, chm, ffmpeg, etc.)
              shell: bash
              run: ./build/getDependencies-windows.sh

            # The prepared collections the BloomE2E suite opens, and the books and reference
            # screenshots the visual-regression suite renders, live in
            # https://github.com/BloomBooks/bloom-testing-inputs, at the commit named by
            # build/testing-inputs.pin. This fetches that commit into output/testing-inputs. It is a
            # shallow single-commit fetch, so it costs a couple of seconds. Done here with the other
            # dependency fetches rather than beside the suite, so a bad pin fails early and visibly.
            - name: Get testing inputs (test books and reference screenshots)
              # Only the two Bloom-driving suites consume these, so a fetch failure must not block a
              # run that has both of them switched off.
              if: ${{ env.RUN_E2E_TESTS == 'true' || env.RUN_VISUAL_REGRESSION == 'true' }}
              shell: bash
              run: node build/get-testing-inputs.mjs

            - name: pnpm install
              shell: bash
              run: |
                  # Install the two workspaces in parallel, but wait on each PID
                  # individually: a bare `wait` (no operands) always exits 0, so it would
                  # mask a failed install (e.g. an out-of-date lockfile) and let the step
                  # pass green. `wait <pid>` propagates that child's exit status instead,
                  # so under the runner's `set -e` a failed install fails the step.
                  (cd src/content && pnpm install --frozen-lockfile) &
                  pid_content=$!
                  (cd src/BloomBrowserUI && pnpm install --frozen-lockfile) &
                  pid_ui=$!
                  wait "$pid_content"
                  wait "$pid_ui"

            # Master/alpha builds always take the newest floating front-end deps rather
            # than the lockfile-pinned versions (bloom-player from its alpha channel,
            # latest comicaljs / language-chooser / image-gallery), matching the TeamCity
            # master build.
            - name: Update floating front-end dependencies
              working-directory: src/BloomBrowserUI
              shell: bash
              run: pnpm update bloom-player@alpha comicaljs@latest "@ethnolib/language-chooser-react-mui@latest" bloom-image-gallery

            # ----- Front-end build + tests -----

            - name: Build browser UI (production)
              id: build_frontend
              working-directory: src/BloomBrowserUI
              run: pnpm run build-prod

            # The junit file feeds this suite's "Publish ..." step at the end of the job.
            #
            # Two easy ways to get a silently-empty report here, both of which we have hit:
            #
            # 1. Do NOT write `pnpm run test:ci -- --reporter=...`. pnpm (unlike npm) forwards
            #    the `--` through to the script as a literal argv element, so vitest sees
            #    `vitest run "--" "--reporter=junit" ...`. Its CLI parser treats everything
            #    after a bare `--` as passthrough, so every flag is ignored: vitest falls back
            #    to vite.config.mts's `reporters`, which only includes junit under
            #    TEAMCITY_VERSION (unset here), so no file is written and the publish step
            #    reports the C# suite alone. Pass the flags with no `--`.
            # 2. Use the string form --outputFile=, NOT --outputFile.junit=: vite.config.mts
            #    sets outputFile to a plain string, and the dotted CLI form does not override
            #    it — vitest again falls back to the config path. The string form overrides
            #    correctly and vitest creates the directory.
            #
            # The publish step below sets action_fail_on_inconclusive, so if this ever regresses
            # again the job goes red instead of quietly under-reporting.
            - name: Run browser UI tests
              id: frontend_tests
              # success() reproduces the default gating this step had before the condition was added.
              if: ${{ success() && env.RUN_FRONTEND_TESTS == 'true' }}
              working-directory: src/BloomBrowserUI
              run: pnpm run test:ci --reporter=default --reporter=junit --outputFile=../../output/Tests/vitest-junit.xml

            # ----- C# build + tests -----
            # We want the C# suite to run even when the front-end TESTS fail, so a broken
            # night still reports C# breakage too — not just half the picture. But the C#
            # build needs the front-end BUILD output, so the whole C# group is gated on
            # build_frontend having succeeded. Each C# step additionally requires the
            # previous one to have succeeded, which preserves fail-fast within the group (a
            # failed restore shouldn't kick off a doomed build, etc.). !cancelled() is what
            # lets these run despite the earlier front-end-test failure — it drops the
            # implicit success() gate — while still skipping if the whole run is cancelled.
            #
            # Restore SIL.BuildTasks in its own msbuild invocation: Bloom.proj's UsingTask
            # declarations only load if those dlls already exist, so a combined build would
            # not see them. RestartBuild=false stops RestoreBuildTasks from ALSO running
            # BuildInternal (it does that when the dlls were missing), which would compile
            # the whole app twice — once here and once in the Build step below.
            - name: Restore MSBuild build tasks
              id: restore_build_tasks
              if: ${{ !cancelled() && steps.build_frontend.outcome == 'success' }}
              working-directory: build
              shell: pwsh
              run: msbuild Bloom.proj /t:RestoreBuildTasks /p:RestartBuild=false

            - name: Build
              id: build_csharp
              if: ${{ !cancelled() && steps.restore_build_tasks.outcome == 'success' }}
              working-directory: build
              shell: pwsh
              run: msbuild Bloom.proj /t:Build /m /p:BUILD_NUMBER=$env:BUILD_NUMBER

            # The nightly is the run that pays for the slow tests, so it excludes as little as
            # possible: only SkipOnTeamCity. It deliberately keeps Integration (the tests that
            # talk to the live S3 bucket) and Nightly, both of which the harvester workflow and
            # developers' local runs leave out. Don't "align" this list with theirs
            # — if the nightly skips these too, nothing runs them at all.
            - name: Run C# tests
              id: csharp_tests
              if: ${{ !cancelled() && steps.build_csharp.outcome == 'success' && env.RUN_CSHARP_TESTS == 'true' }}
              working-directory: build
              shell: pwsh
              run: |
                  msbuild Bloom.proj /t:TestOnly `
                    /p:BUILD_NUMBER=$env:BUILD_NUMBER `
                    /p:excludedCategories=SkipOnTeamCity

            # ----- BloomE2E tests -----
            # src/BloomE2E launches a real Bloom.exe on a throwaway copy of a collection, attaches
            # Playwright to its embedded WebView2 over CDP, and clicks through the UI the way a
            # person would. Nothing ran these until now, so the suite could rot silently between the
            # days a developer happened to run it — exactly what the component-tester harness did.
            #
            # Like the visual-regression suite it needs BOTH builds (the Bloom.exe it launches, and
            # the front-end assets that Bloom loads its UI from) and the testing inputs fetched
            # above; workspace-tabs.spec.ts opens the prepared "basic" collection, and the fixture
            # copies it before Bloom sees it. !cancelled() lets it run even when an earlier suite
            # failed, so one bad night still reports every stack.
            #
            # It runs BEFORE the visual-regression group on purpose, even though that group was
            # here first. Visual regression is the suite that hangs (BL-16612): when it does, it
            # burns ~24 minutes and can take the job's whole timeout with it, so anything placed
            # after it is hostage to a failure that has nothing to do with it. Running first means
            # this suite always reports. It also keeps the Bloom logs the diagnostics steps collect
            # for that hunt as the visual-regression Bloom's own: both suites write
            # %TEMP%\SIL\Bloom\Log.txt, and whoever ran last is what is left there to collect.
            #
            # No `playwright install`: the fixture attaches to Bloom's WebView2 with
            # chromium.connectOverCDP, so Playwright launches no browser of its own and needs no
            # downloaded one.
            - name: Set up BloomE2E tests
              id: setup_e2e_tests
              if: ${{ !cancelled() && steps.build_frontend.outcome == 'success' && steps.build_csharp.outcome == 'success' && env.RUN_E2E_TESTS == 'true' }}
              working-directory: src/BloomE2E
              shell: bash
              run: pnpm install --frozen-lockfile

            # Playwright takes its junit path from PLAYWRIGHT_JUNIT_OUTPUT_NAME, not from a CLI flag:
            # it has no --outputFile (that is vitest's). The path is relative to the working
            # directory, so it climbs back to the repo root's output/Tests like the other suites.
            - name: Run BloomE2E tests
              id: e2e_tests
              if: ${{ !cancelled() && steps.setup_e2e_tests.outcome == 'success' }}
              working-directory: src/BloomE2E
              shell: bash
              env:
                  PLAYWRIGHT_JUNIT_OUTPUT_NAME: ../../output/Tests/e2e-junit.xml
                  # The html reporter would otherwise try to serve the report at the end of a
                  # failing run, which on a runner means a step that never returns.
                  PLAYWRIGHT_HTML_OPEN: never
                  # Put every window this run opens off every monitor. Bloom obeys this variable
                  # only under --automation, which is what the fixture launches; see
                  # src/BloomE2E/README.md. The runner has a desktop, so a visible window would
                  # also work, but asking for it here says what the run needs instead of leaving
                  # it to whatever the runner happens to do.
                  BLOOM_AUTOMATION_MONITOR: headless
              run: pnpm test --reporter=list,junit,html

            # What explains an e2e failure: Playwright's HTML report, plus the trace and failure
            # screenshot its config keeps (trace: retain-on-failure, screenshot: only-on-failure).
            # On failure only: a green run's report says nothing a green check has not already said,
            # the same reason the visual-regression screenshots below go up only on failure.
            #
            # !cancelled() is load-bearing, not decoration. A step `if:` with no status-check
            # function in it gets an implicit `success()` AND-ed in, and success() is already false
            # once the e2e step has failed -- so `outcome == 'failure'` alone would skip this upload
            # on precisely the night we want the report, and show as "skipped" rather than red.
            - name: Upload BloomE2E report
              if: ${{ !cancelled() && steps.e2e_tests.outcome == 'failure' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-report
                  path: |
                      src/BloomE2E/playwright-report/**
                      src/BloomE2E/test-results/**
                  retention-days: 4
                  if-no-files-found: ignore

            # ----- Visual regression tests -----
            # src/BloomVisualRegressionTests drives a real Release Bloom.exe (which it finds at
            # output/Release/x64/Bloom.exe) over HTTP and compares rendered screenshots against the
            # reference images in output/testing-inputs (pixelmatch), fetched by the "Get testing
            # inputs" step above. It needs BOTH builds: the C# build (the
            # Bloom.exe it launches) AND the front-end build (Bloom loads its UI from the built
            # browser assets that the C# build copies into its output). So both must have
            # succeeded — build_csharp already implies build_frontend (the C# chain is gated on
            # it), but we require both explicitly for clarity. !cancelled() lets these run even
            # when the unit-test steps above failed, so the nightly still reports visual breakage.
            # The run step then chains on this setup step's success (like the C# chain), so a
            # failed install/browser-download cleanly skips the run rather than triggering a
            # confusing secondary failure — the failed setup step still turns the job red.
            - name: Set up visual regression tests
              id: setup_visual_regression
              if: ${{ !cancelled() && steps.build_frontend.outcome == 'success' && steps.build_csharp.outcome == 'success' && env.RUN_VISUAL_REGRESSION == 'true' }}
              working-directory: src/BloomVisualRegressionTests
              shell: bash
              run: |
                  pnpm install --frozen-lockfile
                  # The suite drives a headless chromium (Playwright) to capture bloom-player pages.
                  pnpm exec playwright install chromium

            # This suite hangs intermittently (BL-16612): Bloom stops making progress, stops writing
            # to its log, and every case then times out — so the run tells us only that something
            # stopped, never what. What would identify it is each thread's stack while it was stuck,
            # and we cannot collect that afterwards: the suite's own afterAll kills Bloom
            # (taskkill /T /F) before any later step could look. So start a watchdog that runs
            # ALONGSIDE the tests and grabs the stacks while Bloom is still wedged (on the observed
            # failures it stayed stuck ~24 minutes, so there is plenty of time).
            #
            # Purely observational: it reads process state and never touches Bloom, so it cannot
            # change the outcome of the run it is watching. Best-effort — `|| true` because a
            # watchdog that fails to start must never turn the nightly red.
            - name: Start the hung-Bloom watchdog
              if: ${{ !cancelled() && steps.setup_visual_regression.outcome == 'success' }}
              shell: pwsh
              run: |
                  try { dotnet tool install --global dotnet-stack } catch { Write-Host "dotnet-stack install skipped: $_" }
                  $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

                  # Start-Process resolves relative paths against the PROCESS working directory, which is
                  # not necessarily PowerShell's location, so be explicit about both. A watchdog that
                  # silently fails to launch would cost us a whole night.
                  $repo = (Get-Location).Path
                  Start-Process pwsh `
                    -ArgumentList '-NoProfile', '-File', "$repo\build\ci\watch-for-hung-bloom.ps1" `
                    -WorkingDirectory $repo `
                    -WindowStyle Hidden

                  # Confirm it really came up, so a non-start is visible in this log rather than being
                  # discovered as an empty artifact tomorrow.
                  Start-Sleep -Seconds 5
                  if (Test-Path "$repo\bloom-watchdog\samples.txt") {
                      Write-Host "watchdog confirmed running:"
                      Get-Content "$repo\bloom-watchdog\samples.txt"
                  } else {
                      Write-Host "WARNING: the watchdog did not start; the run continues without stack capture"
                  }
                  exit 0

            # Reporter flags rather than config so this suite's own vitest.config.ts stays about
            # timeouts. Same no-`--` rule as the browser UI tests above — see that step's comment.
            - name: Run visual regression tests
              id: visual_regression
              if: ${{ !cancelled() && steps.setup_visual_regression.outcome == 'success' }}
              working-directory: src/BloomVisualRegressionTests
              shell: bash
              run: pnpm test --reporter=default --reporter=junit --outputFile=../../output/Tests/visual-regression-junit.xml

            # When the visual-regression step fails, the most useful clue is usually Bloom's own
            # log (it launches a real Bloom.exe and talks to it over HTTP). Bloom writes to
            # %TEMP%\SIL\Bloom\Log.txt (and, depending on how far it got, %LOCALAPPDATA%\SIL\Bloom);
            # a crash on startup often leaves a .NET Watson/CLR entry in the Windows Application
            # event log. Gather whatever exists into a fixed folder so the next step can upload it,
            # rather than losing the one thing that explains a "Bloom never came up" failure.
            # Best-effort throughout: never let missing logs turn this diagnostic step red.
            #
            # Runs on SUCCESS as well as failure (BL-16612). Chasing an intermittent hang means the
            # healthy runs are evidence too: without a known-good log and watchdog sample to compare
            # against, a failing run's numbers mean nothing in isolation. Throwing away everything
            # from the green runs is precisely what has made this bug so hard to pin down.
            - name: Collect Bloom diagnostics
              if: ${{ !cancelled() && steps.visual_regression.outcome != 'skipped' }}
              shell: bash
              run: |
                  set +e
                  dest="bloom-diagnostics"
                  mkdir -p "$dest"
                  # Thread stacks + process samples from the watchdog, if it saw anything worth keeping.
                  if [ -d "bloom-watchdog" ]; then
                      echo "Found watchdog output"
                      cp -r "bloom-watchdog" "$dest/watchdog" 2>/dev/null
                  fi
                  for src in "$TEMP/SIL/Bloom" "$LOCALAPPDATA/SIL/Bloom" "$LOCALAPPDATA/Temp/SIL/Bloom"; do
                      if [ -d "$src" ]; then
                          echo "Found Bloom logs in: $src"
                          # Flatten the source root into the name so two Log.txt don't collide.
                          tag=$(echo "$src" | tr '/:\\ ' '____')
                          cp -r "$src" "$dest/$tag" 2>/dev/null
                      fi
                  done
                  # .NET runtime crashes (e.g. a missing WebView2 runtime) surface here even when
                  # Bloom wrote no log of its own.
                  powershell -NoProfile -Command "Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue | Where-Object { \$_.ProviderName -match 'Application Error|.NET Runtime|Windows Error Reporting' } | Format-List TimeCreated, ProviderName, Message" > "$dest/windows-application-events.txt" 2>&1
                  echo "----- collected diagnostics -----"
                  ls -R "$dest" || true

            # The logs / crash events / watchdog stacks gathered above, kept for EVERY run that got
            # as far as the visual-regression suite -- green ones included, for the reason given on
            # the collect step. This is deliberately a SEPARATE artifact from the screenshots below,
            # because it is the cheap half: about 0.4 MB a night against about 28 MB of screenshots.
            # if-no-files-found: ignore avoids a warning if nothing at all was collected.
            - name: Upload Bloom diagnostics
              if: ${{ !cancelled() && steps.visual_regression.outcome != 'skipped' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: bloom-diagnostics
                  path: bloom-diagnostics/**
                  retention-days: 4
                  if-no-files-found: ignore

            # The current + diff images, so a human can see what changed -- on FAILURE only. The
            # *-reference.png baselines are already in the inputs repository; *-current.png and
            # *-diff.png are generated beside them. On a green run no *-diff.png exists at all
            # (nothing mismatched) and the *-current.png set is a ~28 MB re-upload of baselines we
            # already have in git -- 98% of what this step used to upload, for none of the
            # information -- once a night, times retention-days. That is what was blowing out our
            # Actions storage budget, so the pixels now go up only when the pixels are news; what a
            # green run leaves behind is the diagnostics artifact above.
            #
            # A hung Bloom -- what BL-16612 is about -- fails the suite, so failure() still keeps
            # its screenshots; and the diagnostics that actually explain a hang go up either way.
            # if-no-files-found: ignore because a failure can also mean Bloom never launched, in
            # which case there are no screenshots to collect.
            #
            # !cancelled() for the reason given on the BloomE2E upload above: without a status-check
            # function the implicit success() gate skipped this step on every failing night, so the
            # diff images were never actually collected -- run 33607591898 (2026-09-02, scheduled,
            # failed in this very suite) uploaded only nightly-test-results and bloom-diagnostics.
            - name: Upload visual regression screenshots
              if: ${{ !cancelled() && steps.visual_regression.outcome == 'failure' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: visual-regression-diffs
                  path: |
                      output/testing-inputs/collections/**/screenshots/*-current.png
                      output/testing-inputs/collections/**/screenshots/*-diff.png
                  # Four days, so a failure noticed after a weekend is still there to look at.
                  retention-days: 4
                  if-no-files-found: ignore

            # ----- Component-tester tests -----
            # src/BloomBrowserUI/react_components/component-tester renders one React component at a
            # time in a Vite dev server and drives it with Playwright (the *.uitest.ts files beside
            # each component). Nothing ran these until now, which is how the harness sat broken for
            # weeks — a React 17 pin plus a config bug — and it would rot again silently
            # (AUTOMATION-DEBT.md, "The component-tester Playwright suites are not in CI").
            #
            # This is the component config only (playwright.config.ts, which the package's own
            # `pnpm test` uses). The sibling playwright.bloom-exe.config.ts attaches over CDP to a
            # Bloom the developer already has running, so it needs the src/BloomE2E launch fixture
            # before it can run unattended; its specs are excluded by that config's testIgnore.
            #
            # It needs neither build: the harness serves the components from its own Vite dev
            # server, which playwright.config.ts starts as its webServer. So this group depends on
            # nothing above it, and runs even when the builds failed.
            - name: Set up component-tester tests
              id: setup_component_tests
              if: ${{ !cancelled() && env.RUN_COMPONENT_TESTS == 'true' }}
              working-directory: src/BloomBrowserUI/react_components/component-tester
              shell: bash
              run: |
                  pnpm install --frozen-lockfile
                  pnpm exec playwright install chromium

            # Playwright takes its junit path from PLAYWRIGHT_JUNIT_OUTPUT_NAME, not from a CLI
            # flag: it has no --outputFile (that is vitest's). The path is relative to the working
            # directory, so it climbs back to the repo root's output/Tests like the other suites.
            #
            # --timeout raises the per-test 30s of playwright.config.ts, which is a developer's
            # number: it assumes a dev server that has already transformed the module graph. Every
            # CI run starts cold, and the first request for a component pays for transforming that
            # whole graph. Locally, a cold first run failed 12 tests on `page.goto` timing out
            # while the warm re-run of the same suite passed 142 in 58 seconds. So give the runner
            # room rather than reporting a cold start as a broken component. A passing test still
            # returns as soon as it passes, so this costs a green run nothing.
            - name: Run component-tester tests
              id: component_tests
              if: ${{ !cancelled() && steps.setup_component_tests.outcome == 'success' }}
              working-directory: src/BloomBrowserUI/react_components/component-tester
              shell: bash
              env:
                  PLAYWRIGHT_JUNIT_OUTPUT_NAME: ../../../../output/Tests/component-tester-junit.xml
              run: pnpm test --timeout=120000 --reporter=list,junit

            # ----- Test reports, one per suite -----
            # Each suite gets its OWN invocation of the publish action, and therefore its own
            # check run on the commit and its own section in the job summary: pass/fail/skip
            # counts plus per-test annotations for failures.
            #
            # Why not one combined report (what we used to do)? A single merged total hides
            # which stack broke, and — worse — hides a suite that contributed *nothing*. When
            # the vitest junit file silently stopped being written, the combined report still
            # said "All 2 882 tests pass" because the C# suite alone accounts for that; the
            # only hint was a small "1 files" in the summary header. Per-suite reports make a
            # missing suite obvious, and let a red check name the guilty stack directly.
            #
            # Each report shares these conventions:
            #   - always()/!cancelled() plus a check that the suite's test step was not skipped.
            #     Without always() a failing test step would skip its own report, hiding exactly
            #     the run we care about; without the skipped check we would publish an empty
            #     report for a suite that never ran because an earlier build failed.
            #   - check_name must be unique per invocation, or the reports overwrite each other.
            #   - action_fail_on_inconclusive: true — the action treats a missing/empty results
            #     file as "inconclusive", which by default passes green. Since the whole point
            #     here is to notice a suite that reported nothing, make that turn the job red.
            #   - comment_mode: off — this is a health check, not a PR gate. The action defaults
            #     to comment_mode: always, which on a dispatch run against a branch with an open
            #     PR tries to POST a PR comment and fails with 403 "Resource not accessible by
            #     integration" (the job grants checks: write, not pull-requests: write); the
            #     scheduled master run has no PR to comment on anyway.
            #   - files uses the unified input (junit_files/nunit_files are deprecated); the
            #     action auto-detects each file's format (JUnit for vitest, NUnit3 for C#).
            - name: Publish front-end test results
              if: ${{ !cancelled() && steps.frontend_tests.outcome != 'skipped' }}
              uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              with:
                  # Quoted: an unquoted YAML scalar cannot contain ": ".
                  check_name: "Nightly tests: front-end (vitest)"
                  comment_mode: "off"
                  action_fail_on_inconclusive: true
                  files: output/Tests/vitest-junit.xml

            - name: Publish C# test results
              if: ${{ !cancelled() && steps.csharp_tests.outcome != 'skipped' }}
              uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              with:
                  check_name: "Nightly tests: C# (NUnit)"
                  comment_mode: "off"
                  action_fail_on_inconclusive: true
                  files: output/Tests/Release/x64/TestResults.xml

            - name: Publish BloomE2E test results
              if: ${{ !cancelled() && steps.e2e_tests.outcome != 'skipped' }}
              uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              with:
                  check_name: "Nightly tests: BloomE2E (Playwright)"
                  comment_mode: "off"
                  action_fail_on_inconclusive: true
                  files: output/Tests/e2e-junit.xml

            - name: Publish visual regression test results
              if: ${{ !cancelled() && steps.visual_regression.outcome != 'skipped' }}
              uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              with:
                  check_name: "Nightly tests: visual regression"
                  comment_mode: "off"
                  action_fail_on_inconclusive: true
                  files: output/Tests/visual-regression-junit.xml

            - name: Publish component-tester test results
              if: ${{ !cancelled() && steps.component_tests.outcome != 'skipped' }}
              uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              with:
                  check_name: "Nightly tests: component-tester (Playwright)"
                  comment_mode: "off"
                  action_fail_on_inconclusive: true
                  files: output/Tests/component-tester-junit.xml

            - name: Upload test results
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: nightly-test-results
                  # Forward slashes: upload-artifact treats the path as a glob, where a
                  # backslash is an escape character (not a separator) even on Windows, so
                  # back-slashed paths can silently match nothing. Matches the publish step.
                  path: |
                      output/Tests/Release/x64/TestResults.xml
                      output/Tests/vitest-junit.xml
                      output/Tests/e2e-junit.xml
                      output/Tests/visual-regression-junit.xml
                      output/Tests/component-tester-junit.xml
                  retention-days: 14
