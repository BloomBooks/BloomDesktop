# Toolchains and dependencies for a Windows job that builds Bloom and runs its tests: everything
# between checkout and the front-end build. Used by nightly.yml and bot-verify.yml, so that a fix
# the bot proves with bot-verify is proved on the same machine setup the nightly failed on. A
# difference between the two (a Node version, a floating dependency left unupdated) would let a
# fix pass one and fail the other.
#
# Only the setup lives here, not the builds. The nightly report reads each build step's timing from
# the jobs API by step name ("Build browser UI (production)", "Restore MSBuild build tasks",
# "Build"), and the API lists a composite action as ONE step, so a build inside this action would
# drop out of the report. The setup steps can live here because the report only ever adds them up:
# it counts everything before "Build browser UI (production)" as setup. The builds are therefore
# repeated in both workflows; when you change one, change the other.
#
# The caller must check out the repository first: a local action is read from the checkout.

name: Bloom setup
description: Install the toolchains and dependencies that building and testing Bloom on Windows needs.

inputs:
    testing-inputs:
        description: >-
            "true" to fetch bloom-testing-inputs (the collections and reference screenshots that the
            BloomE2E and visual-regression suites use).
        required: true
    test-fonts:
        description: >-
            "true" to install the fonts that the BloomE2E font chooser test needs. Needs
            testing-inputs, which carries the fonts.
        required: true

runs:
    using: composite
    steps:
        # ----- Toolchains -----

        - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
          with:
              dotnet-version: 8.0.x

        - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

        - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
          with:
              package_json_file: src/BloomBrowserUI/package.json

        - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
          with:
              # Track the repo's canonical Node version (.node-version, currently
              # 24.13.0 — also what package.json devEngines pins) rather than a
              # hardcoded major, so the nightly always tests the version developers
              # actually use and never drifts from it.
              node-version-file: .node-version
              cache: pnpm
              cache-dependency-path: |
                  src/BloomBrowserUI/pnpm-lock.yaml
                  src/content/pnpm-lock.yaml
                  src/BloomE2E/pnpm-lock.yaml
                  src/BloomVisualRegressionTests/pnpm-lock.yaml
                  src/BloomBrowserUI/react_components/component-tester/pnpm-lock.yaml

        # ----- Dependencies (mirrors init.sh) -----

        - name: Get binary dependencies (TeamCity artifacts, chm, ffmpeg, etc.)
          shell: bash
          run: ./build/getDependencies-windows.sh

        # The prepared collections the BloomE2E suite opens, and the books and reference
        # screenshots the visual-regression suite renders, live in
        # https://github.com/BloomBooks/bloom-testing-inputs, at the commit named by
        # build/testing-inputs.pin. This fetches that commit into output/testing-inputs. It is a
        # shallow single-commit fetch, so it costs a couple of seconds. Done here with the other
        # dependency fetches rather than beside the suite, so a bad pin fails early and visibly.
        - name: Get testing inputs (test books and reference screenshots)
          # Only the two Bloom-driving suites consume these, so a fetch failure must not block a
          # run that has both of them switched off.
          if: ${{ inputs.testing-inputs == 'true' }}
          shell: bash
          run: node build/get-testing-inputs.mjs

        # The font chooser test (src/BloomE2E/tests/font-chooser.spec.ts) needs one installed
        # font of each verdict Bloom gives, and a clean windows-latest runner has only
        # Microsoft fonts: nothing Bloom calls "unknown", and nothing non-Microsoft it calls
        # "unsuitable". bloom-testing-inputs carries the missing fonts under fonts/ (its
        # fonts/README.md says which and why); this installs them for the runner's user. The
        # script fails if GDI+ does not list them afterwards, which is what Bloom reads.
        - name: Install test fonts
          if: ${{ inputs.test-fonts == 'true' }}
          shell: powershell
          run: ./src/BloomE2E/scripts/install-test-fonts.ps1

        - name: pnpm install
          shell: bash
          run: |
              # Install the two workspaces in parallel, but wait on each PID
              # individually: a bare `wait` (no operands) always exits 0, so it would
              # mask a failed install (e.g. an out-of-date lockfile) and let the step
              # pass green. `wait <pid>` propagates that child's exit status instead,
              # so under the runner's `set -e` a failed install fails the step.
              (cd src/content && pnpm install --frozen-lockfile) &
              pid_content=$!
              (cd src/BloomBrowserUI && pnpm install --frozen-lockfile) &
              pid_ui=$!
              wait "$pid_content"
              wait "$pid_ui"

        # Master/alpha builds always take the newest floating front-end deps rather
        # than the lockfile-pinned versions (bloom-player from its alpha channel,
        # latest comicaljs / language-chooser / image-gallery), matching the TeamCity
        # master build.
        - name: Update floating front-end dependencies
          working-directory: src/BloomBrowserUI
          shell: bash
          run: pnpm update bloom-player@alpha comicaljs@latest "@ethnolib/language-chooser-react-mui@latest" bloom-image-gallery
