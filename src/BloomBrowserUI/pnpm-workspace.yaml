# pnpm policy for the Bloom front-end. See https://pnpm.io/settings
#
# Dependency-risk hardening:
#  - minimumReleaseAge: ignore any package version published less than 7 days
#    (10080 minutes) ago. A freshly-published (possibly compromised) version
#    can't be pulled into a build until it has had time to be noticed/yanked.
#  - savePrefix "": save exact versions so `pnpm add` keeps installs reproducible.
minimumReleaseAge: 10080
# Our own packages are exempt from the age gate: we publish them ourselves and
# often need to consume a release immediately. The whole @ethnolib/* scope is
# exempt (not just language-chooser-react-mui): its siblings — e.g.
# @ethnolib/find-language and @ethnolib/language-chooser-react-hook — are
# published together as transitive deps of that package, so gating them just
# breaks the nightly's floating-dependency update on the day ethnolib releases.
minimumReleaseAgeExclude:
    - bloom-player
    - comicaljs
    - "@ethnolib/*"
    - "@sillsdev/config-r"
savePrefix: ""

# Formerly the yarn "resolutions" block: force a single @types/react across the
# tree. Many @types/* packages pin @types/react@^17, and mixing those with
# @types/react 18 makes MUI component props (e.g. NestedMenuItem) appear to
# require placeholder/onPointerEnterCapture. Dedupe to 18.
overrides:
    "@types/react": "18.3.31"
    "@types/react-dom": "18.3.7"
    "requirejs@<2.3.7": "2.3.7"
    "proxy-addr@<2.0.8": "2.0.8"
    "follow-redirects@<1.16.2": "1.16.2"
    "ajv@<6": "6.15.0"
    "form-data@<3": "2.5.6"
    "axios@<1.21.0": "1.21.0"
    "shell-quote@<1.11.0": "1.11.0"
    "nanoid@<3.3.18": "3.3.18"
    "source-map-js@<1.2.2": "1.2.2"
    "body-parser@<1.20.9": "1.20.9"
    "browserslist@<4.28.7": "4.28.7"
    "postcss@<8.5.23": "8.5.23"
    "brace-expansion@1 <1.1.21": "1.1.21"
    "brace-expansion@2 <2.1.7": "2.1.7"
    "brace-expansion@5 <5.0.9": "5.0.9"
    "brace-expansion@5 <5.0.12": "5.0.12"
    "underscore@<1.13.8": "1.13.8"
    "js-yaml@<4.3.2": "4.3.2"
    "minimatch@3 <3.1.4": "3.1.4"
    "semver@7 <7.5.2": "7.5.2"
    "vite@7 <7.3.7": "7.3.7"
    "decode-uri-component@<0.5.1": "0.5.1"
    "fast-copy@2 <2.2.0": "2.2.0"
    "fast-copy@3 <3.1.0": "3.1.0"
    "markdown-it@<14.3.3": "14.3.3"
    "qs@6 <6.16.1": "6.16.1"
    "linkify-it@<5.0.2": "5.0.2"
    "vitest@<4.1.11": "4.1.11"
    "@vitest/mocker@<4.1.12": "4.1.12"
    "lodash@<4.18.1": "4.18.1"
    "@babel/core@<7.29.6": "7.29.6"
    "d3-color@<3.1.0": "3.1.0"
    "glob@11 <11.1.0": "11.1.0"

# Replaces patch-package. Patch files live in ./patches and are applied by pnpm
# during install.
patchedDependencies:
    react-collapse-pane@3.0.1: patches/react-collapse-pane@3.0.1.patch
    react-lazyload@3.2.0: patches/react-lazyload@3.2.0.patch

# Build-script allowlist. pnpm does NOT run a dependency's install/postinstall
# script unless it is explicitly allowed here. Only esbuild (needs its
# platform-specific binary) genuinely requires its script; the rest are
# funding/notice postinstalls we deliberately skip. (Git hooks are installed by
# scripts/setup-git-hooks.mjs via the package.json "prepare" script, not by a
# dependency build script.)
allowBuilds:
    "@fortawesome/fontawesome-common-types": false
    "@fortawesome/fontawesome-svg-core": false
    "@fortawesome/free-solid-svg-icons": false
    core-js: false
    core-js-pure: false
    esbuild: true
    less-watch-compiler: false
    styled-components: false
