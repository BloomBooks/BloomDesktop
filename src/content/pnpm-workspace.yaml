# pnpm policy for the Bloom content build. See https://pnpm.io/settings
#
# Dependency-risk hardening:
#  - minimumReleaseAge: ignore any package version published less than 7 days
#    (10080 minutes) ago, so a freshly-published (possibly compromised) version
#    can't be pulled into a build until it has had time to be noticed/yanked.
#  - savePrefix "": save exact versions so `pnpm add` keeps installs reproducible.
minimumReleaseAge: 10080
savePrefix: ""

# Build-script allowlist. core-js's only postinstall is an Open Collective
# funding notice, so we skip it.
allowBuilds:
    core-js: false

overrides:
    "ajv@<6": "6.15.0"
    "form-data@<3": "2.5.6"
    "shell-quote@<1.11.0": "1.11.0"
    "brace-expansion@1 <1.1.21": "1.1.21"
    "brace-expansion@2 <2.1.7": "2.1.7"
    "decode-uri-component@<0.5.1": "0.5.1"
    "qs@6 <6.16.1": "6.16.1"
    "pug@3 <3.0.3": "3.0.3"
